# Build locally with scripts/build-image.sh, then paste this file into Portainer.
services:
  craft-wrapper:
    container_name: craft-wrapper
    image: craft-openapi-wrapper:local
    pull_policy: never
    restart: unless-stopped
    environment:
      # Configure at least one connection; absent adapters have no routes.
      - CRAFT_SPACE_BASE_URL
      - CRAFT_DOCUMENTS_BASE_URL
      - CRAFT_DAILY_BASE_URL
      - WRAPPER_API_TOKEN=${WRAPPER_API_TOKEN:?Set an independent wrapper bearer token}
      - CRAFT_TIMEOUT_SECONDS=${CRAFT_TIMEOUT_SECONDS:-30}
      - CRAFT_CONNECT_TIMEOUT_SECONDS=${CRAFT_CONNECT_TIMEOUT_SECONDS:-5}
      - WRAPPER_ENABLED_OPERATIONS
      - WRAPPER_PUBLIC_URL
    networks:
      - tools

networks:
  tools:
    external: true
    name: ${WRAPPER_NETWORK:?Set an existing Docker network shared with the tool client}
