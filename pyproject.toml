[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "craft-openapi-wrapper"
version = "0.2.0"
description = "A small, tool-friendly OpenAPI HTTP wrapper for the Craft Space API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "openapi-spec-validator>=0.7.2,<0.9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/craft_wrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "integrations"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
